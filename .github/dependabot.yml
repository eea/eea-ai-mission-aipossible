version: 2
updates:
  # uv updates pyproject.toml and uv.lock together with a real resolver.
  # requirements.txt is generated from uv.lock (see .github/workflows/tests.yml).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # pydantic pins an exact pydantic-core, so a lone pydantic-core bump is
    # unresolvable and only ever edits requirements.txt (reverted by the sync
    # job, leaving an empty PR). pydantic-core moves with pydantic in uv.lock.
    ignore:
      - dependency-name: "pydantic-core"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(ci)"

  # ui/ is built by the "UI build" job in tests.yml. Majors get their own PR so a
  # breaking upgrade (like Tailwind 3 -> 4) isn't hidden inside a grouped bump.
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(ui)"
    groups:
      # react and react-dom peer-depend on the same major, so they must move together
      # (split major PRs #59/#61 each failed npm ci). Listed first: first match wins.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      ui-dependencies:
        update-types:
          - "minor"
          - "patch"
