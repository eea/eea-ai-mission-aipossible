name: Security Scan

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Vulnerabilities (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          vuln-type: "library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"

  code-scan:
    name: Python Code Scan (Bandit high)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit (high severity, medium+ confidence)
        run: |
          bandit -r adaptation_stories analysis pre_analysis scripts exporters env_settings.py main.py -lll -ii
