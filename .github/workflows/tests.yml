name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  EXPORT_CMD: uv export --no-hashes --no-emit-project --no-annotate --format requirements-txt -o requirements.txt

jobs:
  # Dependabot (uv ecosystem) updates pyproject.toml and uv.lock but not the exported
  # requirements.txt, so regenerate it on Dependabot PRs and push it back to the PR branch.
  sync-requirements:
    name: Sync requirements.txt (Dependabot)
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Regenerate requirements.txt from uv.lock
        run: $EXPORT_CMD

      - name: Commit if changed
        run: |
          if git diff --quiet -- requirements.txt; then
            echo "requirements.txt already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): regenerate requirements.txt from uv.lock" -- requirements.txt
          git push

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: sync-requirements
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On Dependabot PRs, test the branch head including the regenerated requirements.txt.
          ref: ${{ github.actor == 'dependabot[bot]' && github.head_ref || '' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Check requirements.txt matches uv.lock
        run: |
          $EXPORT_CMD
          if ! git diff --exit-code -- requirements.txt; then
            echo "::error file=requirements.txt::requirements.txt is out of sync with uv.lock. Run: $EXPORT_CMD"
            exit 1
          fi

      - name: Install requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  # The Python jobs above never touch ui/, so a broken UI (e.g. Dependabot's #54 bumping
  # Tailwind 3 -> 4 without the config migration) would otherwise pass CI.
  ui-build:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
